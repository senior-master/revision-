<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Abdul's WhatsApp Automation</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7f6;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px 25px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: #25D366;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #25D366;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #codeSection {
            display: none;
            margin-top: 25px;
        }

        .message {
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        /* Success Popup */

        .popup {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .popup-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .popup-box h2 {
            margin-bottom: 10px;
        }

        .popup-box p {
            color: #666;
            margin-bottom: 20px;
        }

        .close-btn {
            background: #25D366;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>
        Welcome to Abdul's WhatsApp Automation Page
    </h1>

    <p class="subtitle">
        Enter your email to verify your identity.
    </p>

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
    >

    <button
        id="getCodeButton"
        onclick="getCode()"
    >
        Get Code
    </button>


    <div id="codeSection">

        <p class="message">
            A verification code has been sent to your email.
        </p>

        <input
            type="text"
            id="verificationCode"
            placeholder="Enter verification code"
            maxlength="6"
            inputmode="numeric"
        >

        <button
            onclick="verifyCode()"
        >
            Verify Code
        </button>

    </div>

</div>


<!-- SUCCESS POPUP -->

<div
    class="popup"
    id="successPopup"
>

    <div class="popup-box">

        <h2>
            ✅ Verification Success
        </h2>

        <p>
            Your email has been successfully verified.
        </p>

        <button
            class="close-btn"
            onclick="closePopup()"
        >
            Continue
        </button>

    </div>

</div>


<script>

    /*
        TEMPORARY LOCAL BACKEND

        This will later be replaced with
        your temporary public backend URL.
    */

    const API_URL = "https://offshore-football-programmer-permitted.trycloudflare.com";




    async function getCode() {

        const email =
            document.getElementById("email")
                .value.trim();

        const button =
            document.getElementById("getCodeButton");


        if (email === "") {

            alert("Please enter your email.");

            return;
        }


        if (!email.includes("@") || !email.includes(".")) {

            alert("Please enter a valid email address.");

            return;
        }


        button.disabled = true;
        button.textContent = "Sending...";


        try {

            const response = await fetch(
                API_URL + "/request-code",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email
                    })
                }
            );


            const data = await response.json();


            if (!data.success) {

                alert(data.message);

                button.disabled = false;
                button.textContent = "Get Code";

                return;
            }


            document.getElementById("codeSection")
                .style.display = "block";


            document.getElementById("codeSection")
                .scrollIntoView({
                    behavior: "smooth"
                });


            button.textContent = "Code Sent";


        } catch (error) {

            alert(
                "Unable to connect to the verification server."
            );

            button.disabled = false;
            button.textContent = "Get Code";

        }

    }


    async function verifyCode() {

        const enteredCode =
            document.getElementById("verificationCode")
                .value.trim();


        if (enteredCode === "") {

            alert("Please enter the verification code.");

            return;
        }


        try {

            const response = await fetch(
                API_URL + "/verify-code",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        code: enteredCode
                    })
                }
            );


            const data = await response.json();


            if (data.success) {

                document.getElementById("successPopup")
                    .style.display = "flex";

            } else {

                alert(
                    "Wrong code. A new code has been generated."
                );

                document.getElementById("verificationCode")
                    .value = "";

            }

        } catch (error) {

            alert(
                "Unable to connect to the verification server."
            );

        }

    }


    function closePopup() {

        document.getElementById("successPopup")
            .style.display = "none";

    }

</script>

</body>
</html>
